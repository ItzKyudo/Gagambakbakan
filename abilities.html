<style>
/* Shared look for every page. Single dark look by choice: a moonlit pond at night. */
:root {
  color-scheme: dark;
  --bg: #111c1b;
  --surface: #192927;
  --surface-2: #223633;
  --line: #34504b;
  --fg: #e8eee4;
  --muted: #95aaa1;
  --amber: #f2a33a;
  --amber-dark: #8f4f14;
  --amber-light: #ffd694;
  --jade: #4cc7b2;
  --jade-dark: #1d6a64;
  --jade-light: #b0f2e3;
  --guard: #8fb7d6;
  --bark: #7b5b3e;
  --bark-dark: #4a3524;
  --bark-light: #a58059;
  --danger: #e8593f;
  --display: "Bowlby One", "Arial Black", system-ui, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1 .a { color: var(--amber); }
h1 .j { color: var(--jade); }
.btn { display: inline-block; font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; line-height: 1.2; padding: 10px 20px; border-radius: 4px; border: 2px solid var(--fg); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; text-align: center; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #2a1a05; }
.btn.ghost { font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .mb:focus-visible, .card-pick:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .04em; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 1px 8px; }

/* hexagon gem used on the ability, pick and settings pages */
.pgem { --c: var(--amber); position: relative; display: inline-block; width: 64px; height: 64px; flex: none; color: var(--amber-light); }
.pgem .shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pgem .shape polygon { fill: rgba(12, 24, 23, .84); stroke: var(--c); stroke-width: 4; stroke-linejoin: round; }
.pgem .glyph { position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; transform: translate(-50%, -50%); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pgem.locked { color: var(--muted); }
.pgem.locked .shape polygon { stroke: var(--line); }

/* skill cards (ability page and the pick screen) */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.skill { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--fg); font: inherit; min-width: 0; }
.skill h3 { font-family: var(--label); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.skill .meta { font-family: var(--label); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.skill .desc { grid-column: 1 / -1; font-size: 14px; }
.skill.locked { background: transparent; border-style: dashed; }
.skill.locked h3 { color: var(--muted); }
.prog { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.prog .track { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--jade); }
.tag { display: inline-block; font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; margin-left: 6px; color: var(--muted); vertical-align: middle; }

/* simple page frame for abilities and settings */
.page { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }
.page-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 38px); line-height: 1.05; }
.note { color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>

<style>
.skill .top { display: contents; }

<div class="page">
  <header class="page-top">
    <h1>Abilities</h1>
    <a class="btn ghost" href="menu.html">Menu</a>
  </header>
  <p class="note"><span class="count" id="count"></span> &middot; At the start of every match you are dealt 3 random cards from the abilities you have unlocked, and you keep 2 of them.</p>
  <div class="cards" id="grid"></div>

<script>
/* Shared by every page: saved settings, key binds, the ability catalog with unlock rules, progress, and music.
   All saved data lives in the browser's storage under the "gb-" prefix and falls back to defaults if storage is blocked. */
var GB = (function () {
  'use strict';
  // Inside the app shell (index.html) the pages run in an iframe and share the shell's audio, so the music never stops between pages.
  var HOST = null;
  try { if (window.parent !== window && window.parent.GB && window.parent.GB.isHost) HOST = window.parent.GB; } catch (e) { HOST = null; }
  var PFX = 'gb-';
  function lsGet(k, d) {
    try { var v = localStorage.getItem(PFX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { /* storage is optional */ }
  }

  /* ---------- settings ---------- */
  var DEF_SET = { sfx: true, sfxVol: 0.7, music: true, musicVol: 0.5, diff: 'normal' };
  function settings() {
    var s = lsGet('settings', {}) || {}, o = {};
    Object.keys(DEF_SET).forEach(function (k) {
      o[k] = (s[k] === undefined || typeof s[k] !== typeof DEF_SET[k]) ? DEF_SET[k] : s[k];
    });
    if (['easy', 'normal', 'hard'].indexOf(o.diff) < 0) o.diff = 'normal';
    o.sfxVol = Math.max(0, Math.min(1, o.sfxVol)); o.musicVol = Math.max(0, Math.min(1, o.musicVol));
    return o;
  }
  function saveSettings(o) { lsSet('settings', o); }
  function mode() { var m = lsGet('mode', 'cpu'); return m === '2p' ? '2p' : 'cpu'; }
  function setMode(m) { lsSet('mode', m === '2p' ? '2p' : 'cpu'); }


  /* ---------- spider looks ---------- */
  var COLORS = [
    { id: 'amber', label: 'Amber', main: '#f2a33a', dark: '#8f4f14', light: '#ffd694' },
    { id: 'jade', label: 'Jade', main: '#4cc7b2', dark: '#1d6a64', light: '#b0f2e3' },
    { id: 'ruby', label: 'Ruby', main: '#e4584f', dark: '#7e2220', light: '#ffb3a8' },
    { id: 'violet', label: 'Violet', main: '#a77bf0', dark: '#512f94', light: '#d9c5ff' },
    { id: 'azure', label: 'Azure', main: '#5aa9f0', dark: '#1f4e8c', light: '#bfe0ff' },
    { id: 'lime', label: 'Lime', main: '#9ccc3c', dark: '#4a6a14', light: '#dcf5a0' },
    { id: 'rose', label: 'Rose', main: '#ec7fb2', dark: '#8a2f5c', light: '#ffc7df' },
    { id: 'bone', label: 'Bone', main: '#d9d2bd', dark: '#6c654f', light: '#f5f1e4' }
  ];
  var PATTERNS = [['stripes', 'Stripes'], ['dots', 'Dots'], ['chevron', 'Chevrons'], ['plain', 'Plain']];
  var ACCS = [['none', 'None'], ['band', 'Headband'], ['crown', 'Crown'], ['horns', 'Horns']];
  var DEF_LOOK = {
    p1: { name: 'Amber', color: 'amber', pattern: 'stripes', acc: 'none' },
    p2: { name: 'Jade', color: 'jade', pattern: 'stripes', acc: 'none' }
  };
  function color(id) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i]; return COLORS[0]; }
  function has(list, id) { return list.some(function (x) { return x[0] === id; }); }
  function cleanLook(v, d) {
    v = v || {};
    var o = {
      name: typeof v.name === 'string' ? v.name.replace(/[<>&"]/g, '').trim().slice(0, 10) : d.name,
      color: COLORS.some(function (c) { return c.id === v.color; }) ? v.color : d.color,
      pattern: has(PATTERNS, v.pattern) ? v.pattern : d.pattern,
      acc: has(ACCS, v.acc) ? v.acc : d.acc
    };
    if (!o.name) o.name = color(o.color).label;
    return o;
  }
  function looks() { var l = lsGet('looks', {}) || {}; return { p1: cleanLook(l.p1, DEF_LOOK.p1), p2: cleanLook(l.p2, DEF_LOOK.p2) }; }
  function saveLooks(l) { lsSet('looks', l); }
  function randomLook() {
    var c = COLORS[Math.random() * COLORS.length | 0];
    return { name: c.label, color: c.id, pattern: PATTERNS[Math.random() * PATTERNS.length | 0][0], acc: ACCS[Math.random() * ACCS.length | 0][0] };
  }

  function spiderSVGraw(look) {
    var c = GB.color(look.color), OUT = 'rgba(8,16,15,.78)', legs = '', far = '';
    for (var i = 0; i < 4; i++) {
      var hx = 66 + i * 20, fx = 52 + i * 30, kx = (hx + fx) / 2 + (i < 2 ? -16 : 16);
      legs += '<path d="M' + hx + ' 114 Q' + kx + ' 78 ' + fx + ' 146" />';
      far += '<path d="M' + (hx + 8) + ' 112 Q' + (kx + 10) + ' 82 ' + (fx + 14) + ' 146" />';
    }
    var pat = '';
    if (look.pattern === 'stripes') [72, 88, 104].forEach(function (x) { pat += '<rect x="' + x + '" y="60" width="9" height="76" fill="rgba(20,12,6,.36)"/>'; });
    else if (look.pattern === 'dots') [[74, 88], [90, 106], [104, 90], [86, 76], [112, 108], [68, 108]].forEach(function (p) { pat += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="rgba(20,12,6,.36)"/>'; });
    else if (look.pattern === 'chevron') [70, 86, 102].forEach(function (x) { pat += '<polyline points="' + (x - 9) + ',72 ' + (x + 3) + ',98 ' + (x - 9) + ',124" fill="none" stroke="rgba(20,12,6,.36)" stroke-width="7" stroke-linejoin="round"/>'; });
    var acc = '';
    if (look.acc === 'band') acc = '<path d="M128 80 Q150 70 172 80" fill="none" stroke="#e8593f" stroke-width="7" stroke-linecap="round"/><path d="M128 80 L110 76 M128 80 L112 88" stroke="#e8593f" stroke-width="4" stroke-linecap="round"/>';
    else if (look.acc === 'crown') acc = '<path d="M133 72 L133 54 L142 63 L150 49 L158 63 L167 54 L167 72 Z" fill="#ffd34d" stroke="' + OUT + '" stroke-width="2.4" stroke-linejoin="round"/>';
    else if (look.acc === 'horns') acc = '<path d="M130 78 L134 54 L146 72 Z M170 78 L166 54 L154 72 Z" fill="#f4efe0" stroke="' + OUT + '" stroke-width="2.2" stroke-linejoin="round"/>';
    return '<svg viewBox="0 0 240 180" aria-hidden="true"><defs><radialGradient id="pb" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="' + c.light + '"/><stop offset=".5" stop-color="' + c.main + '"/><stop offset="1" stop-color="' + c.dark + '"/></radialGradient>' +
      '<radialGradient id="ph" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="' + c.main + '"/><stop offset="1" stop-color="' + c.dark + '"/></radialGradient><clipPath id="pc"><ellipse cx="90" cy="98" rx="44" ry="34"/></clipPath></defs>' +
      '<rect x="8" y="146" width="224" height="20" rx="10" fill="#7b5b3e"/><rect x="8" y="146" width="224" height="5" rx="2.5" fill="#a58059"/>' +
      '<g class="bob"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="' + OUT + '" stroke-width="6.4">' + far + '</g><g stroke="' + c.dark + '" stroke-width="4">' + far + '</g></g>' +
      '<ellipse cx="90" cy="98" rx="44" ry="34" fill="url(#pb)"/><g clip-path="url(#pc)">' + pat + '</g><ellipse cx="90" cy="98" rx="44" ry="34" fill="none" stroke="' + OUT + '" stroke-width="2.4"/>' +
      '<ellipse cx="150" cy="92" rx="28" ry="23" fill="url(#ph)" stroke="' + OUT + '" stroke-width="2.4"/>' +
      '<g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="' + OUT + '" stroke-width="6.4">' + legs + '</g><g stroke="' + c.main + '" stroke-width="4">' + legs + '</g></g>' +
      '<g><circle cx="162" cy="84" r="5.4" fill="#f4f7ee"/><circle cx="163.5" cy="85" r="2.7" fill="#10201f"/><circle cx="151" cy="79" r="4.4" fill="#f4f7ee"/><circle cx="152.5" cy="80" r="2.2" fill="#10201f"/><circle cx="171" cy="94" r="3.8" fill="#f4f7ee"/><circle cx="172" cy="94.6" r="1.9" fill="#10201f"/></g>' +
      '<path d="M174 100 L184 106 L176 108 Z" fill="#10201f"/>' + acc + '</g></svg>';
  }
  // u keeps the gradient ids unique when more than one spider is on a page
  function spiderSVG(look, u) {
    u = u || '';
    return spiderSVGraw(look).replace(/id="(pb|ph|pc)"/g, 'id="$1' + u + '"').replace(/url\(#(pb|ph|pc)\)/g, 'url(#$1' + u + ')');
  }

  /* ---------- key binds ---------- */
  var ACTIONS = [
    ['left', 'Move left'], ['right', 'Move right'], ['strike', 'Strike'], ['block', 'Block'],
    ['climb', 'Climb (tap)'], ['s1', 'Skill 1'], ['s2', 'Skill 2']
  ];
  var DEF_KEYS = {
    p1: { left: 'KeyA', right: 'KeyD', strike: 'KeyF', block: 'KeyG', climb: 'Space', s1: 'KeyQ', s2: 'KeyE' },
    p2: { left: 'ArrowLeft', right: 'ArrowRight', strike: 'KeyK', block: 'KeyL', climb: 'Enter', s1: 'Comma', s2: 'Period' }
  };
  var RESERVED = ['Escape', 'KeyP', 'KeyH', 'Tab', 'F5', 'F12'];
  function keys() {
    var saved = lsGet('keys', {}) || {}, o = { p1: {}, p2: {} };
    ['p1', 'p2'].forEach(function (p) {
      ACTIONS.forEach(function (a) {
        var v = saved[p] && saved[p][a[0]];
        o[p][a[0]] = (typeof v === 'string' && v && RESERVED.indexOf(v) < 0) ? v : DEF_KEYS[p][a[0]];
      });
    });
    return o;
  }
  function saveKeys(k) { lsSet('keys', k); }
  function defaultKeys() { return JSON.parse(JSON.stringify(DEF_KEYS)); }
  var LABELS = {
    Space: 'Space', Enter: 'Enter', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
    Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\',
    Minus: '-', Equal: '=', Backquote: '`', ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl',
    AltLeft: 'L-Alt', AltRight: 'R-Alt', Backspace: 'Backspace', NumpadEnter: 'Num Enter'
  };
  function keyLabel(code) {
    if (LABELS[code]) return LABELS[code];
    var m = /^Key(.)$/.exec(code); if (m) return m[1];
    m = /^Digit(\d)$/.exec(code); if (m) return m[1];
    m = /^Numpad(.+)$/.exec(code); if (m) return 'Num ' + m[1];
    return code;
  }

  /* ---------- abilities ---------- */
  // use: 'stand' skills work while clinging to the twig, 'hang' skills only while dangling on the thread.
  var SKILLS = [
    // Balance notes: cooldown scales with how much a skill gives. Quick utility is 3 to 6 s, a hit worth about one strike (20 grip) is about 7 s,
    // and anything that wins a whole exchange (full guard, a stun plus a free hit) is 9 s or more.
    { id: 'dash', name: 'Dash', cd: 3, use: 'stand', icon: 'ic-dash', unlock: { t: 'start' },
      desc: 'A quick hop with a moment of invulnerability.' },
    { id: 'web', name: 'Web', cd: 5, use: 'stand', icon: 'ic-web', unlock: { t: 'start' },
      desc: 'Tangles and slows your rival for 1.6 seconds. A perfect block reflects it.' },
    { id: 'surge', name: 'Surge', cd: 5, use: 'hang', icon: 'ic-surge', unlock: { t: 'start' },
      desc: 'Only while dangling: one big pull worth about six taps.' },
    { id: 'power', name: 'Power Strike', cd: 8, use: 'stand', icon: 'ic-power', unlock: { t: 'start' },
      desc: 'Your next strike within 5 seconds hits for 36 grip and shoves much harder.' },
    { id: 'shield', name: 'Iron Silk', cd: 11, use: 'stand', icon: 'ic-shield', unlock: { t: 'start' },
      desc: 'A silk bubble that absorbs the next hit or shot within 4 seconds.' },
    { id: 'mend', name: 'Mend', cd: 12, use: 'stand', icon: 'ic-mend', unlock: { t: 'wins', n: 1 },
      desc: 'Patch yourself up and restore 35 grip.' },
    { id: 'carapace', name: 'Carapace', cd: 12, use: 'stand', icon: 'ic-carapace', unlock: { t: 'played', n: 2 },
      desc: 'Harden your shell: your guard bar refills instantly and a guard break is cleared.' },
    { id: 'pounce', name: 'Pounce', cd: 6, use: 'stand', icon: 'ic-pounce', unlock: { t: 'wins', n: 2 },
      desc: 'Lunge across the twig and strike in one move.' },
    { id: 'sweep', name: 'Sweep', cd: 8, use: 'stand', icon: 'ic-sweep', unlock: { t: 'played', n: 3 },
      desc: 'A low leg sweep: 10 grip and a big shove. Can knock a rival off the end. You are open if it whiffs.' },
    { id: 'spit', name: 'Venom Spit', cd: 7, use: 'stand', icon: 'ic-spit', unlock: { t: 'wins', n: 3 },
      desc: 'A fast shot that stuns your rival for almost a second.' },
    { id: 'anchor', name: 'Anchor Line', cd: 11, use: 'hang', icon: 'ic-anchor', unlock: { t: 'played', n: 4 },
      desc: 'Only while dangling: your thread stops sinking for 2.5 seconds, so you can climb in peace.' },
    { id: 'riposte', name: 'Riposte', cd: 11, use: 'stand', icon: 'ic-riposte', unlock: { t: 'wins', n: 4 },
      desc: 'For 1 second, the next hit on you is cancelled and your attacker is stunned.' },
    { id: 'tremor', name: 'Tremor', cd: 9, use: 'stand', icon: 'ic-tremor', unlock: { t: 'played', n: 5 },
      desc: 'Shake the twig. A nearby rival who is not blocking is stunned.' },
    { id: 'haste', name: 'Haste', cd: 10, use: 'stand', icon: 'ic-haste', unlock: { t: 'wins', n: 5 },
      desc: 'Move 50% faster for 3.5 seconds.' },
    { id: 'hook', name: 'Silk Hook', cd: 7, use: 'stand', icon: 'ic-hook', unlock: { t: 'wins', n: 6 },
      desc: 'Fire a hook that yanks your rival right up to you and stuns them briefly.' },
    { id: 'leech', name: 'Leech Fang', cd: 7, use: 'stand', icon: 'ic-leech', unlock: { t: 'wins', n: 7 },
      desc: 'Your next hit within 5 seconds also heals you for 20 grip.' }
  ];
  var BY_ID = {};
  SKILLS.forEach(function (s) { BY_ID[s.id] = s; });

  /* ---------- progress ---------- */
  function progress() {
    var p = lsGet('progress', {}) || {};
    return { played: p.played | 0, wins: p.wins | 0, unlockAll: !!p.unlockAll };
  }
  function saveProgress(p) { lsSet('progress', p); }
  function isUnlocked(id, p) {
    var s = BY_ID[id]; if (!s) return false;
    p = p || progress();
    if (p.unlockAll || s.unlock.t === 'start') return true;
    if (s.unlock.t === 'wins') return p.wins >= s.unlock.n;
    if (s.unlock.t === 'played') return p.played >= s.unlock.n;
    return false;
  }
  function need(id) {
    var s = BY_ID[id], p = progress(), u = s.unlock;
    if (u.t === 'start') return { have: 1, need: 1, text: 'Unlocked from the start' };
    if (u.t === 'wins') return { have: Math.min(p.wins, u.n), need: u.n, text: 'Win ' + u.n + (u.n === 1 ? ' match' : ' matches') + ' against the CPU' };
    return { have: Math.min(p.played, u.n), need: u.n, text: 'Play ' + u.n + ' matches' };
  }
  function unlockedIds(p) { return SKILLS.filter(function (s) { return isUnlocked(s.id, p); }).map(function (s) { return s.id; }); }
  function recordMatch(won) {
    var before = unlockedIds(), p = progress();
    p.played++; if (won) p.wins++;
    saveProgress(p);
    var after = unlockedIds(p);
    return { unlocked: after.filter(function (id) { return before.indexOf(id) < 0; }) };
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function draw(n) { return shuffle(unlockedIds()).slice(0, n); }

  /* ---------- audio: one shared context, plus a small generative music loop ---------- */
  var AC = null;
  function ctx() {
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    return AC;
  }
  // Two generative tracks share one gain node: a calm "ambient" loop for menus and card picks, and a driving "duel" loop for fights.
  var mus = { gain: null, timer: null, step: 0, next: 0, on: false, track: 'ambient', noise: null };
  var LEAD = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33];
  var BASS = [110, 87.31, 98, 82.41];
  function note(c, t, f, dur, type, vol, dest) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || mus.gain); o.start(t); o.stop(t + dur + 0.05);
  }
  var lead = 3;
  function ambientStep(c, t, n) {
    if (n % 8 === 0) { note(c, t, BASS[(n / 8) % 4 | 0], 2.2, 'sine', 0.6); }
    if (n % 2 === 0 || Math.random() < 0.3) {
      lead = Math.max(0, Math.min(LEAD.length - 1, lead + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 2 : 1)));
      if (Math.random() < 0.8) note(c, t, LEAD[lead], 0.9, 'triangle', 0.22);
    }
  }

  /* Duel: 150 bpm, A minor, sixteenth-note grid. Taiko-style kick on the beat, snare on 2 and 4, a galloping bass,
     and brass-like stacked saw chords that follow a four-bar i - VI - III - VII progression with a heroic lead on top. */
  var DUEL_ROOTS = [110, 87.31, 130.81, 98];            // A, F, C, G
  var DUEL_CHORD = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]];
  var DUEL_MEL = [
    [440, 0, 523.25, 440, 0, 392, 440, 0, 659.25, 0, 587.33, 523.25, 0, 440, 392, 0],
    [349.23, 0, 440, 349.23, 0, 329.63, 349.23, 0, 523.25, 0, 440, 392, 0, 349.23, 329.63, 0],
    [523.25, 0, 659.25, 523.25, 0, 440, 523.25, 0, 783.99, 0, 659.25, 587.33, 0, 523.25, 440, 0],
    [392, 0, 493.88, 392, 0, 349.23, 392, 0, 587.33, 0, 523.25, 493.88, 0, 392, 349.23, 659.25]
  ];
  function noiseBuf(c) {
    if (mus.noise) return mus.noise;
    var b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (mus.noise = b);
  }
  function kick(c, t, vol) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(mus.gain); o.start(t); o.stop(t + 0.3);
  }
  function snare(c, t, vol) {
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf(c); f.type = 'highpass'; f.frequency.value = 1400;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    s.connect(f); f.connect(g); g.connect(mus.gain); s.start(t); s.stop(t + 0.2);
    note(c, t, 190, 0.1, 'triangle', vol * 0.8);
  }
  function hat(c, t, vol) {
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf(c); f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(f); f.connect(g); g.connect(mus.gain); s.start(t); s.stop(t + 0.05);
  }
  function duelStep(c, t, n) {
    var st = n % 16, bar = (n / 16 | 0) % 4, root = DUEL_ROOTS[bar];
    if (st % 4 === 0) kick(c, t, 0.9);
    if (st === 10 && bar % 2 === 1) kick(c, t, 0.7);
    if (st === 4 || st === 12) snare(c, t, 0.45);
    if (st % 2 === 0) hat(c, t, st % 4 === 2 ? 0.14 : 0.08);
    // galloping bass: root on the beat, octave on the off-sixteenths
    if (st % 4 === 0 || st % 4 === 1 || st % 4 === 3) note(c, t, st % 4 === 3 ? root * 2 : root, 0.17, 'sawtooth', 0.24);
    // brass chord stabs on beats 1 and 3, plus a held swell at the start of each bar
    if (st === 0 || st === 8) DUEL_CHORD[bar].forEach(function (f) { note(c, t, f, st === 0 ? 0.9 : 0.35, 'sawtooth', 0.075); note(c, t, f * 1.004, st === 0 ? 0.9 : 0.35, 'square', 0.03); });
    var m = DUEL_MEL[bar][st];
    if (n >= 32 && m) { note(c, t, m, 0.2, 'sawtooth', 0.11); note(c, t, m * 2, 0.16, 'triangle', 0.05); }
    // a rising riser every 4 bars before the loop repeats
    if (st === 8 && bar === 3) { var o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.8); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85); o.connect(g); g.connect(mus.gain); o.start(t); o.stop(t + 0.9); }
  }
  function musicSchedule() {
    var c = ctx(); if (!c || !mus.on) return;
    var step = mus.track === 'duel' ? 0.1 : 0.32;     // 150 bpm sixteenths are 0.1 s
    while (mus.next < c.currentTime + 0.5) {
      (mus.track === 'duel' ? duelStep : ambientStep)(c, mus.next, mus.step++);
      mus.next += step;
    }
  }
  function startTrack(track) {
    var s = settings();
    if (!s.music) { mus.track = track; return; }
    var c = ctx(); if (!c) return;
    if (mus.on && mus.track === track) return;
    if (mus.on) stopTrack();
    try { if (c.state === 'suspended') c.resume(); } catch (e) { /* ignore */ }
    mus.track = track;
    mus.gain = c.createGain(); mus.gain.gain.value = s.musicVol * (track === 'duel' ? 0.4 : 0.3); mus.gain.connect(c.destination);
    mus.on = true; mus.step = 0; mus.next = c.currentTime + 0.1;
    mus.timer = setInterval(musicSchedule, 100);
  }
  function stopTrack() {
    if (!mus.on) return;
    mus.on = false; clearInterval(mus.timer);
    var g = mus.gain;
    try { g.gain.setTargetAtTime(0, ctx().currentTime, 0.15); setTimeout(function () { try { g.disconnect(); } catch (e) { /* ignore */ } }, 1500); } catch (e) { /* ignore */ }
  }
  // Browsers only allow sound after a tap or key press. So: try to start right away (works when the browser allows it), and otherwise
  // start on the very first click, tap or key press anywhere on the page. `C` and `M` are the audio context and music player in use.
  function armWith(C, M, track) {
    var evs = ['pointerdown', 'mousedown', 'touchstart', 'click', 'keydown'];
    track = track || 'ambient';
    var done = function () {
      var c = C();
      if (c && c.state === 'running') { evs.forEach(function (e) { window.removeEventListener(e, kick, true); }); return true; }
      return false;
    };
    var kick = function () {
      var c = C(); M.play(track);
      try { if (c && c.state !== 'running') { var r = c.resume(); if (r && r.then) r.then(done); } } catch (e) { /* ignore */ }
      done();
    };
    M.play(track);
    try { var c0 = C(); if (c0) c0.onstatechange = function () { done(); }; } catch (e) { /* ignore */ }
    if (!done()) evs.forEach(function (e) { window.addEventListener(e, kick, true); });
  }
  var music = {
    start: function (track) { startTrack(track || mus.track); },
    // switch to another track (menu loop, duel loop) with a quick fade of the old one
    play: function (track) { mus.track = track; startTrack(track); },
    stop: stopTrack,
    setVolume: function (v) { if (mus.gain) { try { mus.gain.gain.value = v * (mus.track === 'duel' ? 0.4 : 0.3); } catch (e) { /* ignore */ } } },
    arm: function (track) { armWith(ctx, music, track); }
  };
  function beep(f) {
    var s = settings(); if (!s.sfx) return;
    var c = (HOST ? HOST.ctx : ctx)(); if (!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain(), n = c.currentTime;
      o.type = 'triangle'; o.frequency.value = f || 520;
      g.gain.setValueAtTime(Math.max(0.0002, 0.08 * s.sfxVol), n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.15);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(n + 0.16);
    } catch (e) { /* ignore */ }
  }

  /* ---------- small DOM helpers ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function iconEl(id, cls) {
    var s = document.createElementNS(NS, 'svg'), u = document.createElementNS(NS, 'use');
    s.setAttribute('class', cls || 'ico'); s.setAttribute('aria-hidden', 'true');
    u.setAttribute('href', '#' + id); s.appendChild(u);
    return s;
  }
  // hexagon gem with an icon inside, the same shape used for the in-game ability buttons
  function gemEl(iconId, locked) {
    var w = el('span', 'pgem' + (locked ? ' locked' : ''));
    var s = document.createElementNS(NS, 'svg'), p = document.createElementNS(NS, 'polygon');
    s.setAttribute('class', 'shape'); s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('aria-hidden', 'true');
    p.setAttribute('points', '50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5'); s.appendChild(p);
    w.appendChild(s); w.appendChild(iconEl(locked ? 'ic-lock' : iconId, 'glyph'));
    return w;
  }

  return {
    el: el, iconEl: iconEl, gemEl: gemEl,
    COLORS: COLORS, PATTERNS: PATTERNS, ACCS: ACCS, DEF_LOOK: DEF_LOOK, color: color, looks: looks, saveLooks: saveLooks, randomLook: randomLook, spiderSVG: spiderSVG,
    settings: settings, saveSettings: saveSettings, mode: mode, setMode: setMode,
    ACTIONS: ACTIONS, RESERVED: RESERVED, keys: keys, saveKeys: saveKeys, defaultKeys: defaultKeys, keyLabel: keyLabel,
    SKILLS: SKILLS, skill: function (id) { return BY_ID[id]; },
    progress: progress, saveProgress: saveProgress, isUnlocked: isUnlocked, need: need, recordMatch: recordMatch,
    unlockedIds: unlockedIds, draw: draw, shuffle: shuffle,
    isHost: false, ctx: HOST ? HOST.ctx : ctx,
    music: HOST ? { start: HOST.music.start, play: HOST.music.play, stop: HOST.music.stop, setVolume: HOST.music.setVolume, arm: function (t) { armWith(HOST.ctx, HOST.music, t); } } : music,
    beep: beep
  };
})();

</script>
<script>
(function () {
  'use strict';
  var el = GB.el, grid = document.getElementById('grid'), p = GB.progress();
  var n = GB.unlockedIds(p).length;
  document.getElementById('count').textContent = n + ' of ' + GB.SKILLS.length + ' unlocked';
  GB.SKILLS.forEach(function (s) {
    var open = GB.isUnlocked(s.id, p);
    var c = el('article', 'skill' + (open ? '' : ' locked'));
    c.appendChild(GB.gemEl(s.icon, !open));
    var head = el('div');
    var h = el('h3', null, s.name); head.appendChild(h);
    head.appendChild(el('div', 'meta', open ? s.cd + 's cooldown · ' + (s.use === 'hang' ? 'while dangling' : 'while clinging') : 'Locked'));
    c.appendChild(head);
    if (open) c.appendChild(el('p', 'desc', s.desc));
    else {
      var nd = GB.need(s.id), pr = el('div', 'prog');
      pr.appendChild(el('span', null, nd.text + ' (' + nd.have + '/' + nd.need + ')'));
      var tr = el('div', 'track'), bar = el('i'); bar.style.width = Math.round(100 * nd.have / nd.need) + '%';
      tr.appendChild(bar); pr.appendChild(tr); c.appendChild(pr);
    }
    grid.appendChild(c);
  });
  GB.music.arm();
})();
</script>
