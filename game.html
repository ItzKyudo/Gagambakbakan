<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Gagambakbakan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=Bowlby+One&display=swap">
<style>
/* Shared look for every page. Single dark look by choice: a moonlit pond at night. */
:root {
  color-scheme: dark;
  --bg: #111c1b;
  --surface: #192927;
  --surface-2: #223633;
  --line: #34504b;
  --fg: #e8eee4;
  --muted: #95aaa1;
  --amber: #f2a33a;
  --amber-dark: #8f4f14;
  --amber-light: #ffd694;
  --jade: #4cc7b2;
  --jade-dark: #1d6a64;
  --jade-light: #b0f2e3;
  --guard: #8fb7d6;
  --bark: #7b5b3e;
  --bark-dark: #4a3524;
  --bark-light: #a58059;
  --danger: #e8593f;
  --display: "Bowlby One", "Arial Black", system-ui, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1 .a { color: var(--amber); }
h1 .j { color: var(--jade); }
.btn { display: inline-block; font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; line-height: 1.2; padding: 10px 20px; border-radius: 4px; border: 2px solid var(--fg); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; text-align: center; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #2a1a05; }
.btn.ghost { font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .mb:focus-visible, .card-pick:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .04em; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 1px 8px; }

/* hexagon gem used on the ability, pick and settings pages */
.pgem { --c: var(--amber); position: relative; display: inline-block; width: 64px; height: 64px; flex: none; color: var(--amber-light); }
.pgem .shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pgem .shape polygon { fill: rgba(12, 24, 23, .84); stroke: var(--c); stroke-width: 4; stroke-linejoin: round; }
.pgem .glyph { position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; transform: translate(-50%, -50%); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pgem.locked { color: var(--muted); }
.pgem.locked .shape polygon { stroke: var(--line); }

/* skill cards (ability page and the pick screen) */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.skill { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--fg); font: inherit; min-width: 0; }
.skill h3 { font-family: var(--label); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.skill .meta { font-family: var(--label); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.skill .desc { grid-column: 1 / -1; font-size: 14px; }
.skill.locked { background: transparent; border-style: dashed; }
.skill.locked h3 { color: var(--muted); }
.prog { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.prog .track { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--jade); }
.tag { display: inline-block; font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; margin-left: 6px; color: var(--muted); vertical-align: middle; }

/* simple page frame for abilities and settings */
.page { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }
.page-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 38px); line-height: 1.05; }
.note { color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Game page. Layout: slim header, HUD strip, 12:7 arena with ability gems down its left and right edges, touch pad (phones), controls strip.
   Single dark look by choice: a moonlit pond at night. */
:root {
  color-scheme: dark;
  --bg: #111c1b;
  --surface: #192927;
  --surface-2: #223633;
  --line: #34504b;
  --fg: #e8eee4;
  --muted: #95aaa1;
  --amber: #f2a33a;
  --amber-dark: #8f4f14;
  --amber-light: #ffd694;
  --jade: #4cc7b2;
  --jade-dark: #1d6a64;
  --jade-light: #b0f2e3;
  --guard: #8fb7d6;
  --bark: #7b5b3e;
  --bark-dark: #4a3524;
  --bark-light: #a58059;
  --danger: #e8593f;
  --display: "Bowlby One", "Arial Black", system-ui, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin-inline: auto; display: grid; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 5vw, 32px); line-height: 1; margin: 0; }
h1 .a { color: var(--amber); }
h1 .j { color: var(--jade); }

.btn { display: inline-block; font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; line-height: 1.2; padding: 10px 20px; border-radius: 4px; border: 2px solid var(--fg); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #2a1a05; }
.btn.ghost { font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); }
.btn:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
.fighter { display: grid; gap: 6px; min-width: 0; }
.p1 { --c: var(--amber); }
.p2 { --c: var(--jade); }
.fhead { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-family: var(--label); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.p2 .fhead { flex-direction: row-reverse; }
.swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.who { color: var(--muted); font-weight: 500; font-size: 15px; }
.pips { display: flex; gap: 5px; margin-left: auto; }
.p2 .pips { margin-left: 0; margin-right: auto; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.pip.on { background: var(--c); border-color: var(--c); }
.meter { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 8px; font-family: var(--label); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.p2 .meter { grid-template-columns: 1fr 66px; }
.p2 .meter span { order: 2; text-align: right; }
.bar { height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--c); }
.p2 .bar i { margin-left: auto; }
.bar.low i { background: var(--danger); }
.bar.guard { height: 7px; }
.bar.guard i { background: var(--guard); }
.bar.stam i { background: var(--c); opacity: .6; transition: width .4s; }
.center { text-align: center; font-family: var(--label); }
#roundLbl { font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.best { font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

/* Arena */
.arena { position: relative; width: 100%; aspect-ratio: 960 / 560; container-type: inline-size; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #12201f; }
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 12px; background: rgba(10, 20, 19, .66); }
.overlay h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(20px, 5vw, 40px); line-height: 1.05; text-wrap: balance; }
.overlay p { margin: 0; max-width: 44ch; font-size: clamp(12px, 2.4vw, 16px); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* Ability gems: pentagons, icon only, along the bottom left (Amber) and bottom right (Jade) corners. The fill rises as the cooldown runs out. */
.rail { position: absolute; bottom: clamp(6px, 1.4cqw, 14px); z-index: 2; display: grid; grid-auto-flow: column; gap: clamp(6px, 1.4cqw, 12px); }
.rail.l { left: clamp(6px, 1.4cqw, 14px); }
.rail.r { right: clamp(6px, 1.4cqw, 14px); }
.gem { --cd: 0%; --size: clamp(34px, 8.2cqw, 70px); position: relative; display: block; width: var(--size); height: var(--size); padding: 0; border: 0; background: none; color: var(--fg); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
div.gem { cursor: default; }
.gem .shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gem .bg polygon { fill: rgba(12, 24, 23, .84); stroke: var(--c); stroke-width: 3.5; stroke-linejoin: round; opacity: .5; }
.gem .fill { clip-path: inset(var(--cd) 0 0 0); }
.gem .fill polygon { fill: var(--c); opacity: .5; }
.gem .glyph { position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; transform: translate(-50%, -50%); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.gem.ready .bg polygon { opacity: 1; stroke-width: 4.5; }
.gem.ready .fill polygon { opacity: .8; }
.gem.ready .glyph { opacity: 1; color: #fff; }
.gem.ready { filter: drop-shadow(0 0 7px var(--c)); }
.gem.down { transform: scale(.94); }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Touch pad */
.touch { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (pointer: coarse) { .touch { display: grid; } }
.tb { height: 56px; padding: 0; font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; border: 2px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); touch-action: none; user-select: none; -webkit-user-select: none; }
.tb.wide { grid-column: 1 / -1; height: 64px; font-size: 18px; }
.tb.down { background: var(--surface-2); border-color: var(--amber); }

/* Controls strip (hideable) */
.ctl { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: grid; gap: 10px; }
.ctl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ctl h3 { margin: 0; font-family: var(--label); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ctl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ctl-body { display: grid; gap: 10px; }
.krow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.kp1 { --c: var(--amber); }
.kp2 { --c: var(--jade); }
.kn { display: inline-flex; align-items: center; gap: 8px; min-width: 92px; font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.k .ico { color: var(--c); width: 20px; height: 20px; }
kbd { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .04em; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 1px 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 600px) {
  .hud { grid-template-columns: 1fr 1fr; grid-template-areas: "c c" "a b"; gap: 10px 14px; }
  .center { grid-area: c; }
  .p1 { grid-area: a; }
  .p2 { grid-area: b; }
  .fhead { font-size: 17px; }
  .meter, .p2 .meter { grid-template-columns: 54px 1fr; gap: 6px; letter-spacing: .06em; }
  .p2 .meter span { order: 0; text-align: left; }
  .p2 .bar i { margin-left: 0; }
  .overlay { gap: 6px; }
  .btn { padding: 8px 14px; font-size: 15px; }
}
.gem.off { opacity: .35; }
.pick { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: flex; flex-direction: column; background: rgba(8, 16, 15, .94); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pick-in { flex: 1; min-height: 0; width: min(100%, 900px); margin-inline: auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.pk-head { display: grid; gap: 8px; }
.pk-who { font-family: var(--label); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 16px; color: var(--c, var(--amber)); }
.pick h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6vw, 40px); line-height: 1.05; }
.pk-sub { color: var(--muted); }
.pk-foot { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
/* The cards are a hand held at the bottom of the screen: tall, with their lower part hidden below the edge. They rise in, and lift when hovered, focused or picked. */
.pick .cards { --vis: min(300px, 42vh); --hide: 120px; margin-top: auto; height: var(--vis); display: flex; justify-content: center; align-items: flex-start; gap: clamp(8px, 2vw, 20px); text-align: left; }
.card-pick { --y: 0px; --r: 0deg; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; flex: 0 1 260px; min-width: 0; height: calc(var(--vis) + var(--hide)); padding: 20px 18px 0; border: 2px solid var(--line); border-radius: 14px 14px 0 0; background: linear-gradient(#223633, #192927); cursor: pointer; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.22, 1, .36, 1), border-color .25s, background .25s; opacity: 0; }
.card-pick.deal { opacity: 1; animation: rise .9s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(var(--i) * 120ms + 80ms); }
.card-pick.pop { animation: pop .42s cubic-bezier(.2, .9, .3, 1.3); }
.card-pick.pop .pgem { animation: spin .5s cubic-bezier(.2, .9, .3, 1.2); }
.pick.leave .card-pick { transform: translateY(110vh); transition: transform .4s cubic-bezier(.5, 0, .8, .4); }
.pick .btn { transition: transform .12s; }
.pick .btn:active:not(:disabled) { transform: scale(.94); }
.card-pick:nth-child(1) { --r: -3deg; }
.card-pick:nth-child(3) { --r: 3deg; }
.card-pick:hover, .card-pick:focus-visible { --y: -50px; --r: 0deg; }
.card-pick[aria-pressed="true"] { --y: -100px; --r: 0deg; border-color: var(--amber); background: linear-gradient(#2c4642, #1f322f); }
.card-pick .pgem { width: 76px; height: 76px; }
.card-pick h3 { font-size: 26px; }
.card-pick .desc { font-size: 15px; grid-column: auto; }
.card-pick .num { position: absolute; top: 10px; right: 14px; font-family: var(--label); font-weight: 700; font-size: 16px; color: var(--muted); }
.card-pick[aria-pressed="true"] .num { color: var(--amber-light); }
.card-pick[aria-pressed="true"] .pgem .shape polygon { fill: var(--amber-dark); }
@keyframes pop { 0% { scale: 1; box-shadow: 0 0 0 0 rgba(242, 163, 58, .7); } 35% { scale: .93; } 70% { scale: 1.06; box-shadow: 0 0 0 16px rgba(242, 163, 58, 0); } 100% { scale: 1; box-shadow: 0 0 0 0 rgba(242, 163, 58, 0); } }
@keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(-14deg) scale(1.2); } 100% { transform: rotate(0) scale(1); } }
@keyframes rise { from { transform: translateY(110vh) rotate(0deg); opacity: .6; } }
@media (max-width: 600px) {
  .pick .cards { --vis: min(290px, 44vh); --hide: 80px; }
  .card-pick { padding: 14px 10px 0; gap: 8px; }
  .card-pick .pgem { width: 48px; height: 48px; }
  .card-pick h3 { font-size: 19px; }
  .card-pick .meta { font-size: 12px; }
  .card-pick .desc { font-size: 12.5px; }
  .card-pick .num { top: 6px; right: 8px; }
}
#pkCount { font-family: var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>

<script>
/* Shared by every page: saved settings, key binds, the ability catalog with unlock rules, progress, and music.
   All saved data lives in the browser's storage under the "gb-" prefix and falls back to defaults if storage is blocked. */
var GB = (function () {
  'use strict';
  // Inside the app shell (index.html) the pages run in an iframe and share the shell's audio, so the music never stops between pages.
  var HOST = null;
  try { if (window.parent !== window && window.parent.GB && window.parent.GB.isHost) HOST = window.parent.GB; } catch (e) { HOST = null; }
  var PFX = 'gb-';
  function lsGet(k, d) {
    try { var v = localStorage.getItem(PFX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { /* storage is optional */ }
  }

  /* ---------- settings ---------- */
  var DEF_SET = { sfx: true, sfxVol: 0.7, music: true, musicVol: 0.5, diff: 'normal' };
  function settings() {
    var s = lsGet('settings', {}) || {}, o = {};
    Object.keys(DEF_SET).forEach(function (k) {
      o[k] = (s[k] === undefined || typeof s[k] !== typeof DEF_SET[k]) ? DEF_SET[k] : s[k];
    });
    if (['easy', 'normal', 'hard'].indexOf(o.diff) < 0) o.diff = 'normal';
    o.sfxVol = Math.max(0, Math.min(1, o.sfxVol)); o.musicVol = Math.max(0, Math.min(1, o.musicVol));
    return o;
  }
  function saveSettings(o) { lsSet('settings', o); }
  function mode() { var m = lsGet('mode', 'cpu'); return m === '2p' ? '2p' : 'cpu'; }
  function setMode(m) { lsSet('mode', m === '2p' ? '2p' : 'cpu'); }


  /* ---------- spider looks ---------- */
  var COLORS = [
    { id: 'amber', label: 'Amber', main: '#f2a33a', dark: '#8f4f14', light: '#ffd694' },
    { id: 'jade', label: 'Jade', main: '#4cc7b2', dark: '#1d6a64', light: '#b0f2e3' },
    { id: 'ruby', label: 'Ruby', main: '#e4584f', dark: '#7e2220', light: '#ffb3a8' },
    { id: 'violet', label: 'Violet', main: '#a77bf0', dark: '#512f94', light: '#d9c5ff' },
    { id: 'azure', label: 'Azure', main: '#5aa9f0', dark: '#1f4e8c', light: '#bfe0ff' },
    { id: 'lime', label: 'Lime', main: '#9ccc3c', dark: '#4a6a14', light: '#dcf5a0' },
    { id: 'rose', label: 'Rose', main: '#ec7fb2', dark: '#8a2f5c', light: '#ffc7df' },
    { id: 'bone', label: 'Bone', main: '#d9d2bd', dark: '#6c654f', light: '#f5f1e4' }
  ];
  var PATTERNS = [['stripes', 'Stripes'], ['dots', 'Dots'], ['chevron', 'Chevrons'], ['plain', 'Plain']];
  var ACCS = [['none', 'None'], ['band', 'Headband'], ['crown', 'Crown'], ['horns', 'Horns']];
  var DEF_LOOK = {
    p1: { name: 'Amber', color: 'amber', pattern: 'stripes', acc: 'none' },
    p2: { name: 'Jade', color: 'jade', pattern: 'stripes', acc: 'none' }
  };
  function color(id) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i]; return COLORS[0]; }
  function has(list, id) { return list.some(function (x) { return x[0] === id; }); }
  function cleanLook(v, d) {
    v = v || {};
    var o = {
      name: typeof v.name === 'string' ? v.name.replace(/[<>&"]/g, '').trim().slice(0, 10) : d.name,
      color: COLORS.some(function (c) { return c.id === v.color; }) ? v.color : d.color,
      pattern: has(PATTERNS, v.pattern) ? v.pattern : d.pattern,
      acc: has(ACCS, v.acc) ? v.acc : d.acc
    };
    if (!o.name) o.name = color(o.color).label;
    return o;
  }
  function looks() { var l = lsGet('looks', {}) || {}; return { p1: cleanLook(l.p1, DEF_LOOK.p1), p2: cleanLook(l.p2, DEF_LOOK.p2) }; }
  function saveLooks(l) { lsSet('looks', l); }
  function randomLook() {
    var c = COLORS[Math.random() * COLORS.length | 0];
    return { name: c.label, color: c.id, pattern: PATTERNS[Math.random() * PATTERNS.length | 0][0], acc: ACCS[Math.random() * ACCS.length | 0][0] };
  }

  function spiderSVGraw(look) {
    var c = GB.color(look.color), OUT = 'rgba(8,16,15,.78)', legs = '', far = '';
    for (var i = 0; i < 4; i++) {
      var hx = 66 + i * 20, fx = 52 + i * 30, kx = (hx + fx) / 2 + (i < 2 ? -16 : 16);
      legs += '<path d="M' + hx + ' 114 Q' + kx + ' 78 ' + fx + ' 146" />';
      far += '<path d="M' + (hx + 8) + ' 112 Q' + (kx + 10) + ' 82 ' + (fx + 14) + ' 146" />';
    }
    var pat = '';
    if (look.pattern === 'stripes') [72, 88, 104].forEach(function (x) { pat += '<rect x="' + x + '" y="60" width="9" height="76" fill="rgba(20,12,6,.36)"/>'; });
    else if (look.pattern === 'dots') [[74, 88], [90, 106], [104, 90], [86, 76], [112, 108], [68, 108]].forEach(function (p) { pat += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="rgba(20,12,6,.36)"/>'; });
    else if (look.pattern === 'chevron') [70, 86, 102].forEach(function (x) { pat += '<polyline points="' + (x - 9) + ',72 ' + (x + 3) + ',98 ' + (x - 9) + ',124" fill="none" stroke="rgba(20,12,6,.36)" stroke-width="7" stroke-linejoin="round"/>'; });
    var acc = '';
    if (look.acc === 'band') acc = '<path d="M128 80 Q150 70 172 80" fill="none" stroke="#e8593f" stroke-width="7" stroke-linecap="round"/><path d="M128 80 L110 76 M128 80 L112 88" stroke="#e8593f" stroke-width="4" stroke-linecap="round"/>';
    else if (look.acc === 'crown') acc = '<path d="M133 72 L133 54 L142 63 L150 49 L158 63 L167 54 L167 72 Z" fill="#ffd34d" stroke="' + OUT + '" stroke-width="2.4" stroke-linejoin="round"/>';
    else if (look.acc === 'horns') acc = '<path d="M130 78 L134 54 L146 72 Z M170 78 L166 54 L154 72 Z" fill="#f4efe0" stroke="' + OUT + '" stroke-width="2.2" stroke-linejoin="round"/>';
    return '<svg viewBox="0 0 240 180" aria-hidden="true"><defs><radialGradient id="pb" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="' + c.light + '"/><stop offset=".5" stop-color="' + c.main + '"/><stop offset="1" stop-color="' + c.dark + '"/></radialGradient>' +
      '<radialGradient id="ph" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="' + c.main + '"/><stop offset="1" stop-color="' + c.dark + '"/></radialGradient><clipPath id="pc"><ellipse cx="90" cy="98" rx="44" ry="34"/></clipPath></defs>' +
      '<rect x="8" y="146" width="224" height="20" rx="10" fill="#7b5b3e"/><rect x="8" y="146" width="224" height="5" rx="2.5" fill="#a58059"/>' +
      '<g class="bob"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="' + OUT + '" stroke-width="6.4">' + far + '</g><g stroke="' + c.dark + '" stroke-width="4">' + far + '</g></g>' +
      '<ellipse cx="90" cy="98" rx="44" ry="34" fill="url(#pb)"/><g clip-path="url(#pc)">' + pat + '</g><ellipse cx="90" cy="98" rx="44" ry="34" fill="none" stroke="' + OUT + '" stroke-width="2.4"/>' +
      '<ellipse cx="150" cy="92" rx="28" ry="23" fill="url(#ph)" stroke="' + OUT + '" stroke-width="2.4"/>' +
      '<g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="' + OUT + '" stroke-width="6.4">' + legs + '</g><g stroke="' + c.main + '" stroke-width="4">' + legs + '</g></g>' +
      '<g><circle cx="162" cy="84" r="5.4" fill="#f4f7ee"/><circle cx="163.5" cy="85" r="2.7" fill="#10201f"/><circle cx="151" cy="79" r="4.4" fill="#f4f7ee"/><circle cx="152.5" cy="80" r="2.2" fill="#10201f"/><circle cx="171" cy="94" r="3.8" fill="#f4f7ee"/><circle cx="172" cy="94.6" r="1.9" fill="#10201f"/></g>' +
      '<path d="M174 100 L184 106 L176 108 Z" fill="#10201f"/>' + acc + '</g></svg>';
  }
  // u keeps the gradient ids unique when more than one spider is on a page
  function spiderSVG(look, u) {
    u = u || '';
    return spiderSVGraw(look).replace(/id="(pb|ph|pc)"/g, 'id="$1' + u + '"').replace(/url\(#(pb|ph|pc)\)/g, 'url(#$1' + u + ')');
  }

  /* ---------- key binds ---------- */
  var ACTIONS = [
    ['left', 'Move left'], ['right', 'Move right'], ['strike', 'Strike'], ['block', 'Block'],
    ['climb', 'Climb (tap)'], ['s1', 'Skill 1'], ['s2', 'Skill 2']
  ];
  var DEF_KEYS = {
    p1: { left: 'KeyA', right: 'KeyD', strike: 'KeyF', block: 'KeyG', climb: 'Space', s1: 'KeyQ', s2: 'KeyE' },
    p2: { left: 'ArrowLeft', right: 'ArrowRight', strike: 'KeyK', block: 'KeyL', climb: 'Enter', s1: 'Comma', s2: 'Period' }
  };
  var RESERVED = ['Escape', 'KeyP', 'KeyH', 'Tab', 'F5', 'F12'];
  function keys() {
    var saved = lsGet('keys', {}) || {}, o = { p1: {}, p2: {} };
    ['p1', 'p2'].forEach(function (p) {
      ACTIONS.forEach(function (a) {
        var v = saved[p] && saved[p][a[0]];
        o[p][a[0]] = (typeof v === 'string' && v && RESERVED.indexOf(v) < 0) ? v : DEF_KEYS[p][a[0]];
      });
    });
    return o;
  }
  function saveKeys(k) { lsSet('keys', k); }
  function defaultKeys() { return JSON.parse(JSON.stringify(DEF_KEYS)); }
  var LABELS = {
    Space: 'Space', Enter: 'Enter', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
    Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\',
    Minus: '-', Equal: '=', Backquote: '`', ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl',
    AltLeft: 'L-Alt', AltRight: 'R-Alt', Backspace: 'Backspace', NumpadEnter: 'Num Enter'
  };
  function keyLabel(code) {
    if (LABELS[code]) return LABELS[code];
    var m = /^Key(.)$/.exec(code); if (m) return m[1];
    m = /^Digit(\d)$/.exec(code); if (m) return m[1];
    m = /^Numpad(.+)$/.exec(code); if (m) return 'Num ' + m[1];
    return code;
  }

  /* ---------- abilities ---------- */
  // use: 'stand' skills work while clinging to the twig, 'hang' skills only while dangling on the thread.
  var SKILLS = [
    // Balance notes: cooldown scales with how much a skill gives. Quick utility is 3 to 6 s, a hit worth about one strike (20 grip) is about 7 s,
    // and anything that wins a whole exchange (full guard, a stun plus a free hit) is 9 s or more.
    { id: 'dash', name: 'Dash', cd: 3, use: 'stand', icon: 'ic-dash', unlock: { t: 'start' },
      desc: 'A quick hop with a moment of invulnerability.' },
    { id: 'web', name: 'Web', cd: 5, use: 'stand', icon: 'ic-web', unlock: { t: 'start' },
      desc: 'Tangles and slows your rival for 1.6 seconds. A perfect block reflects it.' },
    { id: 'surge', name: 'Surge', cd: 5, use: 'hang', icon: 'ic-surge', unlock: { t: 'start' },
      desc: 'Only while dangling: one big pull worth about six taps.' },
    { id: 'power', name: 'Power Strike', cd: 8, use: 'stand', icon: 'ic-power', unlock: { t: 'start' },
      desc: 'Your next strike within 5 seconds hits for 36 grip and shoves much harder.' },
    { id: 'shield', name: 'Iron Silk', cd: 11, use: 'stand', icon: 'ic-shield', unlock: { t: 'start' },
      desc: 'A silk bubble that absorbs the next hit or shot within 4 seconds.' },
    { id: 'mend', name: 'Mend', cd: 12, use: 'stand', icon: 'ic-mend', unlock: { t: 'wins', n: 1 },
      desc: 'Patch yourself up and restore 35 grip.' },
    { id: 'carapace', name: 'Carapace', cd: 12, use: 'stand', icon: 'ic-carapace', unlock: { t: 'played', n: 2 },
      desc: 'Harden your shell: your guard bar refills instantly and a guard break is cleared.' },
    { id: 'pounce', name: 'Pounce', cd: 6, use: 'stand', icon: 'ic-pounce', unlock: { t: 'wins', n: 2 },
      desc: 'Lunge across the twig and strike in one move.' },
    { id: 'sweep', name: 'Sweep', cd: 8, use: 'stand', icon: 'ic-sweep', unlock: { t: 'played', n: 3 },
      desc: 'A low leg sweep: 10 grip and a big shove. Can knock a rival off the end. You are open if it whiffs.' },
    { id: 'spit', name: 'Venom Spit', cd: 7, use: 'stand', icon: 'ic-spit', unlock: { t: 'wins', n: 3 },
      desc: 'A fast shot that stuns your rival for almost a second.' },
    { id: 'anchor', name: 'Anchor Line', cd: 11, use: 'hang', icon: 'ic-anchor', unlock: { t: 'played', n: 4 },
      desc: 'Only while dangling: your thread stops sinking for 2.5 seconds, so you can climb in peace.' },
    { id: 'riposte', name: 'Riposte', cd: 11, use: 'stand', icon: 'ic-riposte', unlock: { t: 'wins', n: 4 },
      desc: 'For 1 second, the next hit on you is cancelled and your attacker is stunned.' },
    { id: 'tremor', name: 'Tremor', cd: 9, use: 'stand', icon: 'ic-tremor', unlock: { t: 'played', n: 5 },
      desc: 'Shake the twig. A nearby rival who is not blocking is stunned.' },
    { id: 'haste', name: 'Haste', cd: 10, use: 'stand', icon: 'ic-haste', unlock: { t: 'wins', n: 5 },
      desc: 'Move 50% faster for 3.5 seconds.' },
    { id: 'hook', name: 'Silk Hook', cd: 7, use: 'stand', icon: 'ic-hook', unlock: { t: 'wins', n: 6 },

    for (var x2 = 0; x2 <= W; x2 += 12) { var yy = POND_Y + Math.sin(x2 * 0.035 + t * 1.8) * 2.2; if (x2) ctx.lineTo(x2, yy); else ctx.moveTo(x2, yy); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(190,235,240,.18)'; ctx.lineWidth = 1;
    for (var r = 0; r < 5; r++) {
      var rx = (r * 211 + 90) % W, ph = (t * 0.4 + r * 0.37) % 1;
      ctx.beginPath(); ctx.ellipse(rx, POND_Y + 26 + r * 9, 10 + ph * 34, 2 + ph * 5, 0, 0, 7); ctx.globalAlpha = 1 - ph; ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(52,104,64,.95)';
    [[170, 0], [470, 1.4], [800, 2.6]].forEach(function (p) {
      ctx.beginPath(); ctx.ellipse(p[0], POND_Y + 14 + Math.sin(t * 1.2 + p[1]) * 1.2, 26, 6, 0, 0, 7); ctx.fill();
    });
  }

  function drawQuakes() {
    P.forEach(function (s) {
      if (s.quake <= 0) return;
      var k = 1 - s.quake / 0.5;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#e8d9b0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.ellipse(s.x, STICK.y + STICK.th + 6, k * 260, 10 + k * 8, 0, 0, 7); ctx.stroke();
      ctx.restore();
    });
  }
  function drawParts() {
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    floats.forEach(function (f) {
      ctx.globalAlpha = Math.min(1, f.life * 1.6);
      ctx.font = '700 24px ' + LABEL; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(8,16,15,.85)';
      ctx.strokeText(f.text, cl(f.x, 70, W - 70), f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, cl(f.x, 70, W - 70), f.y);
    });
    ctx.globalAlpha = 1;
  }

  function bigText(text, y, size, col, pop) {
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    var sc = 1 + Math.max(0, 0.35 - pop * 1.6);
    ctx.translate(W / 2, y); ctx.scale(sc, sc);
    ctx.font = '400 ' + size + 'px ' + DISPLAY; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(8,16,15,.9)';
    ctx.strokeText(text, 0, 0); ctx.fillStyle = col; ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function draw(t) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy);
    ctx.drawImage(bgc, 0, 0, W, H);
    flies.forEach(function (fl) {
      var x = fl.x + Math.sin(t * fl.sp + fl.ph) * 40, y = fl.y + Math.cos(t * fl.sp * 1.3 + fl.ph) * 24;
      var a = 0.4 + 0.6 * Math.max(0, Math.sin(t * 1.6 + fl.ph * 3));
      ctx.fillStyle = 'rgba(232,245,138,' + (0.14 * a).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(240,250,160,' + a.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
    });
    drawStick(); drawQuakes();
    // draw the spider on the stick first so a rising spider overlaps the right way
    var order = P[0].hang && !P[1].hang ? [P[1], P[0]] : [P[0], P[1]];
    order.forEach(drawSpider);
    webs.forEach(function (w) {
      if (w.k === 'spit') {
        ctx.save(); ctx.translate(w.x, w.y); ctx.fillStyle = 'rgba(156,240,106,.4)'; ctx.beginPath(); ctx.ellipse(-w.vx * 0.02, 0, 14, 3, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#9cf06a'; ctx.strokeStyle = 'rgba(8,16,15,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); return;
      }
      if (w.k === 'hook') {
        var ox = P[w.owner].x + P[w.owner].face * 20, sg2 = Math.sign(w.vx);
        ctx.save(); ctx.strokeStyle = 'rgba(244,248,238,.85)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ox, w.y); ctx.lineTo(w.x, w.y); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(w.x - sg2 * 8, w.y - 6); ctx.quadraticCurveTo(w.x + sg2 * 9, w.y - 6, w.x + sg2 * 6, w.y + 7); ctx.stroke(); ctx.restore(); return;
      }
      ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(w.x * 0.05);
      ctx.strokeStyle = 'rgba(244,248,238,.95)'; ctx.lineWidth = 1.6;
      for (var q = 0; q < 6; q++) {
        var an = q * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * 11, Math.sin(an) * 11); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.stroke();
      ctx.restore();
    });
    drawPond(t);
    drawParts();
    P.forEach(function (s, i) {
      if (s.hang && !s.ko && state === 'fight' && isHuman(i)) {
        var left = Math.max(1, Math.ceil(s.drop / s.tapLift)), label = (coarse ? 'TAP CLIMB' : 'TAP ' + GB.keyLabel(KBp(i).climb).toUpperCase()) + ' \u00D7' + left;
        var lx = cl(s.x, 100, W - 100), ly = Math.min(BODY_Y + s.drop + 26 + 48, H - 52) + Math.sin(t * 9) * 3;
        ctx.save(); ctx.textAlign = 'center'; ctx.font = '700 26px ' + LABEL; ctx.lineWidth = 6; ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(8,16,15,.9)'; ctx.strokeText('▲ ' + label + ' ▲', lx, ly);
        ctx.fillStyle = s.light; ctx.fillText('▲ ' + label + ' ▲', lx, ly);
        // pace gauge: your taps per second (bar) against the pace needed to stop sinking (white tick)
        var bw = 120, bxl = lx - bw / 2, byl = ly + 8, maxR = 1 / s.tapCd, okPace = s.rate >= s.hold;
        ctx.fillStyle = 'rgba(8,16,15,.85)'; ctx.fillRect(bxl - 1, byl - 1, bw + 2, 10);
        ctx.fillStyle = okPace ? s.main : COL.danger; ctx.fillRect(bxl, byl, bw * Math.min(1, s.rate / maxR), 8);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(bxl + bw * Math.min(1, s.hold / maxR) - 1, byl - 3, 2, 14);
        var ly2 = ly + 34;
        var t3 = (s.falls > 1 ? 'FALL ' + s.falls + ' \u00B7 ' : '') + 'NEED ' + s.hold.toFixed(1) + ' TAPS/S';
        ctx.font = '600 17px ' + LABEL; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,16,15,.9)';
        ctx.strokeText(t3, lx, ly2); ctx.fillStyle = s.falls > 1 ? COL.danger : '#ffffff'; ctx.fillText(t3, lx, ly2); ly2 += 20;
        var sgj = s.sk.indexOf('surge');
        if (sgj >= 0 && s.cds[sgj] <= 0) {
          var t2 = 'SURGE READY' + (coarse ? '' : ' · ' + GB.keyLabel(KBp(i)['s' + (sgj + 1)]).toUpperCase());
          ctx.font = '600 17px ' + LABEL; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,16,15,.9)';
          ctx.strokeText(t2, lx, ly2); ctx.fillStyle = '#ffffff'; ctx.fillText(t2, lx, ly2);
        }
        ctx.restore();
      }
    });
    if (!demo) {
      if (state === 'ready') {
        if (stateT < 0.85) bigText('ROUND ' + round, 190, 58, COL.fg, stateT);
        else bigText('FIGHT!', 190, 72, '#ffd694', stateT - 0.85);
      } else if (state === 'roundEnd' && stateT > 0.5) {
        var w = P[1].ko ? P[0] : P[1];
        bigText(w.name.toUpperCase() + ' TAKES IT', 190, 44, w.main, stateT - 0.5);
      }
    }
    ctx.restore();
  }

  /* ---------- HUD / overlay ---------- */
  function renderPips() {
    for (var i = 0; i < 2; i++) {
      var pips = $('pips' + (i + 1)).children;
      for (var j = 0; j < pips.length; j++) pips[j].classList.toggle('on', j < P[i].wins);
    }
  }
  var gemSeen = {};
  function updateHud() {
    for (var i = 0; i < 2; i++) {
      var s = P[i], n = i + 1;
      $('grip' + n).style.width = cl(s.grip, 0, 100) + '%';
      $('guard' + n).style.width = cl(s.guard, 0, 100) + '%';
      $('gb' + n).classList.toggle('low', s.grip < 30);
      for (var j = 0; j < 2; j++) {
        var sd = SK(s.sk[j]), tag = n + (j ? 'b' : 'a'), g = $('g' + tag);
        if (gemSeen[tag] !== sd.id) {
          gemSeen[tag] = sd.id;
          $('gi' + tag).firstElementChild.setAttribute('href', '#' + sd.icon);
          var human = i === 0 || cfg.mode === '2p';
          g.title = sd.name + (human ? ' (' + GB.keyLabel(KBp(i)['s' + (j + 1)]) + ')' : '') + (sd.use === 'hang' ? ' - only while dangling' : '');
          g.setAttribute('aria-label', sd.name);
        }
        var usable = (sd.use === 'hang') === !!s.hang;
        g.style.setProperty('--cd', cl(100 * s.cds[j] / s.cdm[j], 0, 100).toFixed(1) + '%');
        g.classList.toggle('ready', s.cds[j] <= 0 && usable);
        g.classList.toggle('off', !usable);
      }
    }
    var lbl = 'Round ' + round;
    if ($('roundLbl').textContent !== lbl) $('roundLbl').textContent = lbl;
  }
  function setLabels() {
    if (cfg.mode === 'cpu') { $('w1').textContent = 'You'; $('w2').textContent = 'CPU · ' + cfg.diff; }
    else { $('w1').textContent = 'Player 1'; $('w2').textContent = 'Player 2'; }
  }
  function showOv(title, sub, buttons, focus) {
    $('ovTitle').textContent = title; $('ovSub').textContent = sub;
    var box = $('ovBtns'); box.textContent = '';
    buttons.forEach(function (b) {
      var e;
      if (b.href) { e = document.createElement('a'); e.href = b.href; }
      else { e = document.createElement('button'); e.type = 'button'; e.addEventListener('click', b.fn); }
      e.textContent = b.label; e.className = 'btn' + (b.primary ? ' primary' : '');
      box.appendChild(e);
    });
    $('ov').hidden = false;
    var first = box.querySelector('.btn');
    if (focus && first) first.focus({ preventScroll: true });
  }
  function hideOv() {
    $('ov').hidden = true;
    var a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
  }

  // The controls strip is built from the saved key binds and the skills each player picked.
  function kbd(t) { var e = document.createElement('kbd'); e.textContent = t; return e; }
  function addK(row, parts, label) {
    var sp = document.createElement('span'); sp.className = 'k';
    parts.forEach(function (p) { sp.appendChild(p); });
    if (label) sp.appendChild(document.createTextNode(' ' + label));
    row.appendChild(sp);
  }
  function buildCtl() {
    $('kp2').hidden = cfg.mode !== '2p';
    [0, 1].forEach(function (i) {
      var row = $('kp' + (i + 1)), b = KBp(i), L = GB.keyLabel;
      while (row.children.length > 1) row.removeChild(row.lastChild);
      addK(row, [kbd(L(b.left)), kbd(L(b.right))], 'Move');
      addK(row, [kbd(L(b.strike))], 'Strike'); addK(row, [kbd(L(b.block))], 'Block'); addK(row, [kbd(L(b.climb))], 'Climb');
      for (var j = 0; j < 2; j++) { var sd = SK(P[i].sk[j]); addK(row, [kbd(L(b['s' + (j + 1)])), GB.iconEl(sd.icon)], sd.name); }
    });
  }
  function loadCfg() {
    var st = GB.settings();
    cfg.mode = GB.mode(); cfg.diff = st.diff; cfg.sound = st.sfx; cfg.sfxVol = st.sfxVol; KB = GB.keys();
    applyLooks(); setLabels(); buildCtl();
  }
  // Spider looks come from the menu's customization panel. The CPU gets a random look in a different color.
  function applyLooks() {
    var all = GB.looks(), a = all.p1, b = all.p2;
    if (cfg.mode === 'cpu') {
      var rl = GB.randomLook();
      while (rl.color === a.color) rl = GB.randomLook();
      b = rl;
    } else if (b.color === a.color) {
      var alt = GB.COLORS.filter(function (c) { return c.id !== a.color; })[0];
      b = { name: b.name === GB.color(b.color).label ? alt.label : b.name, color: alt.id, pattern: b.pattern, acc: b.acc };
    }
    [a, b].forEach(function (lk, i) {
      var c = GB.color(lk.color), s = P[i];
      s.name = lk.name; s.main = c.main; s.dark = c.dark; s.light = c.light; s.pattern = lk.pattern; s.acc = lk.acc;
      $('n' + (i + 1)).textContent = lk.name; $('kn' + (i + 1)).textContent = lk.name;
      document.querySelectorAll(i ? '.p2,.kp2' : '.p1,.kp1').forEach(function (e) { e.style.setProperty('--c', c.main); });
    });
  }

  /* ---------- skill picking: 3 random cards, keep 2 ---------- */
  var pickFor = 0, offer = [], chosen = [], firstDeal = true;
  function whenShown(fn) {
    var done = false;
    function go() {
      if (done || document.hidden) return;
      done = true; document.removeEventListener('visibilitychange', go);
      requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(fn, 300); }); });
    }
    if (document.hidden) { document.addEventListener('visibilitychange', go); return; }
    var fonts = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1000); })]) : Promise.resolve();
    fonts.then(go);
  }
  function newMatch() {
    started = false; paused = true; hideOv(); loadCfg();
    if (!firstDeal) GB.music.play('ambient');
    P[0].wins = P[1].wins = 0; renderPips();
    openPick(0);
  }
  function openPick(i) {
    picking = true; pickFor = i; offer = GB.draw(3); chosen = [];
    var two = cfg.mode === '2p';
    $('pkWho').textContent = two ? 'Player ' + (i + 1) + ' · ' + P[i].name : P[0].name + ' · you';
    $('pkWho').style.setProperty('--c', P[i].main);
    $('pkSub').textContent = (two && i === 1 ? 'Player 1, look away! ' : '') + 'Choose 2 of these 3 cards. You keep them for the whole match. Press 1, 2 or 3 to choose.';
    var box = $('pkCards'); box.textContent = '';
    offer.forEach(function (id, k) {
      var s = SK(id), c = GB.el('button', 'skill card-pick'); c.type = 'button'; c.setAttribute('aria-pressed', 'false');
      c.style.setProperty('--i', k);
      c.appendChild(GB.el('span', 'num', String(k + 1)));
      c.appendChild(GB.gemEl(s.icon, false));
      var h = GB.el('div'); h.appendChild(GB.el('h3', null, s.name));
      h.appendChild(GB.el('div', 'meta', s.cd + 's cooldown · ' + (s.use === 'hang' ? 'while dangling' : 'while clinging')));
      c.appendChild(h); c.appendChild(GB.el('p', 'desc', s.desc));
      c.addEventListener('click', function () { toggleCard(k); });
      c.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') snd(900, 0.04, 'triangle', 0.02); });
      box.appendChild(c);
    });
    syncPick(); $('pick').hidden = false;
    var deal = function () {
      void box.offsetWidth;      // make sure the pop-up animation restarts every time cards are dealt
      Array.prototype.forEach.call(box.children, function (c) { c.classList.add('deal'); });
      [0, 1, 2].forEach(function (k) { setTimeout(function () { snd(220 + k * 70, 0.3, 'sawtooth', 0.025, 520); }, 80 + k * 120); });
    };
    // The first deal waits until the page is really on screen (visible tab, fonts ready, first frames painted), otherwise the animation can finish before anyone sees it.
    if (firstDeal) { firstDeal = false; whenShown(deal); } else deal();
    box.firstElementChild.focus({ preventScroll: true });
  }
  function toggleCard(k) {
    var ix = chosen.indexOf(k);
    if (ix >= 0) { chosen.splice(ix, 1); snd(440, 0.09, 'triangle', 0.05, -140); }
    else { if (chosen.length >= 2) chosen.shift(); chosen.push(k); snd(620, 0.12, 'triangle', 0.06, 380); setTimeout(function () { snd(930, 0.1, 'sine', 0.04); }, 70); }
    var card = $('pkCards').children[k];
    if (card) { card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop'); }
    syncPick();
  }
  function syncPick() {
    Array.prototype.forEach.call($('pkCards').children, function (c, k) { c.setAttribute('aria-pressed', chosen.indexOf(k) >= 0 ? 'true' : 'false'); });
    $('pkCount').textContent = chosen.length + ' of 2 picked';
    $('pkGo').disabled = chosen.length !== 2;
  }
  var leaving = false;
  function confirmPick() {
    if (chosen.length !== 2 || leaving) return;
    leaving = true;
    P[pickFor].sk = chosen.map(function (k) { return offer[k]; });
    snd(520, 0.12, 'square', 0.04, 260); setTimeout(function () { snd(780, 0.18, 'triangle', 0.05, 200); }, 90);
    $('pick').classList.add('leave');      // the cards drop away before the next step
    setTimeout(function () {
      leaving = false; $('pick').classList.remove('leave');
      if (cfg.mode === '2p' && pickFor === 0) { openPick(1); return; }
      if (cfg.mode === 'cpu') P[1].sk = GB.draw(3).slice(0, 2);
      $('pick').hidden = true; picking = false; gemSeen = {};
      buildCtl(); startMatch();
    }, 400);
  }
  $('pkGo').addEventListener('click', confirmPick);

  function startMatch() {
    started = true; paused = false; round = 1; P[0].wins = P[1].wins = 0; P[0].falls = P[1].falls = 0;
    renderPips(); setLabels(); hideOv(); startRound();
    snd(440, 0.12, 'triangle', 0.05, 220);
    GB.music.play('duel');      // epic duel music for the fight
  }
  var ctlShown = true;
  try { ctlShown = localStorage.getItem('gb-controls') !== '0'; } catch (e) { /* storage is optional */ }
  function setCtl(show) {
    ctlShown = show; $('ctlBody').hidden = !show;
    $('bHide').textContent = show ? 'Hide controls' : 'Show controls';
    $('bHide').setAttribute('aria-expanded', show ? 'true' : 'false');
    try { localStorage.setItem('gb-controls', show ? '1' : '0'); } catch (e) { /* ignore */ }
  }
  function togglePause() {
    if (!started || state === 'matchEnd' || picking) return;
    paused = !paused;
    if (paused) GB.music.stop(); else GB.music.play('duel');
    if (paused) showOv('Paused', 'Take a breath.', [{ label: 'Resume', primary: true, fn: togglePause }, { label: 'Menu', href: 'menu.html' }], true);
    else hideOv();
  }

  /* ---------- events ---------- */
  function isBound(code) {
    return [KB.p1, KB.p2].some(function (b) { return Object.keys(b).some(function (a) { return b[a] === code; }); });
  }
  window.addEventListener('keydown', function (e) {
    if (picking) {
      var m = /^(?:Digit|Numpad)([1-3])$/.exec(e.code);
      if (m && m[1] <= offer.length) { e.preventDefault(); toggleCard(m[1] - 1); }
      else if (e.code === 'Enter' && !(e.target && e.target.closest && e.target.closest('button,a'))) { e.preventDefault(); confirmPick(); }
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (started && state !== 'matchEnd') { e.preventDefault(); togglePause(); }
      return;
    }
    if (e.code === 'KeyH') { setCtl(!ctlShown); return; }
    var ovOpen = paused || state === 'matchEnd';
    var onControl = e.target && e.target.closest && e.target.closest('button,a,input');
    if ((isBound(e.code) || e.code.indexOf('Arrow') === 0) && !(ovOpen && onControl)) e.preventDefault();
    keys.add(e.code);
    if (!e.repeat && !ovOpen && state === 'fight') {
      [0, 1].forEach(function (i) {
        if (i === 1 && cfg.mode !== '2p') return;
        var b = KBp(i);
        if (e.code === b.climb) reelQ[i]++;
        if (e.code === b.s1) abQ[i][0]++;
        if (e.code === b.s2) abQ[i][1]++;
      });
    }
  });
  window.addEventListener('keyup', function (e) { keys.delete(e.code); });
  window.addEventListener('blur', function () { keys.clear(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && started && !paused) togglePause(); });
  $('bPause').addEventListener('click', function () { this.blur(); togglePause(); });
  $('bHide').addEventListener('click', function () { this.blur(); setCtl(!ctlShown); });
  document.querySelectorAll('[data-t]').forEach(function (b) {
    var k = b.dataset.t;
    var off = function () { touch[k] = 0; b.classList.remove('down'); };
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } }
      var live = state === 'fight' && !paused && started;
      if (k === 'reel') { if (live) reelQ[0]++; }
      else if (k === 's1') { if (live) abQ[0][0]++; }
      else if (k === 's2') { if (live) abQ[0][1]++; }
      else touch[k] = 1;
      b.classList.add('down');
    });
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  });

  /* ---------- boot ---------- */
  setCtl(ctlShown); renderPips(); startRound(); newMatch();
  GB.music.arm();
  window.__t = window.__t || null;
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (!paused) update(dt);
    updateHud();
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  
})();

</script>
</body>
